function resize(){
  const r=cv.getBoundingClientRect();
  vw=Math.max(1,r.width); vh=Math.max(1,r.height);
  dpr=Math.min(3, window.devicePixelRatio||1);
  const bw=Math.round(vw*dpr), bh=Math.round(vh*dpr);
  if(cv.width!==bw || cv.height!==bh){ cv.width=bw; cv.height=bh; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(wrap);
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,80));
addEventListener('pageshow',resize);
resize();

function makeCovers(){
  covers=[];
  const positions=[
    [.18,.62],[.50,.58],[.82,.64],
    [.30,.76],[.70,.78]
  ];
  for(const [px,py] of positions){
    covers.push({x:vw*px,y:vh*py,w:54,h:34,r:9});
  }
}
function circleRectHit(c,rect){
  const nx=clamp(c.x,rect.x-rect.w/2,rect.x+rect.w/2);
  const ny=clamp(c.y,rect.y-rect.h/2,rect.y+rect.h/2);
  return Math.hypot(c.x-nx,c.y-ny)<c.r;
}
function moveAroundCovers(obj,dx,dy){
  const ox=obj.x,oy=obj.y;
  obj.x+=dx; obj.y+=dy;
  for(const c of covers){
    if(circleRectHit(obj,c)){
      obj.x=ox; obj.y=oy;
      return false;
    }
  }
  return true;
}
function reset(){
  stage=1; kills=0; total=8; clearTimer=0; message=''; messageTimer=0; combo=0; comboTimer=0; shake=0; perfect=0; gate=false; intro=1.25; boss=false;
  player={x:vw*.5,y:vh*.80,r:24,hp:Math.round(100*characterBonus.maxHp),maxHp:Math.round(100*characterBonus.maxHp),speed:300*characterBonus.spd,fire:0,inv:0,dir:0};
  enemies=[]; rocks=[]; shots=[]; particles=[]; pickups=[];
  levelFlash=0; upgradeOpen=false; skillCharge=0; skillFlash=0;
  makeCovers();
  for(let i=0;i<total;i++) spawnEnemy(i);
  running=true; last=performance.now();
}
function startStage(n){
  // Pull the selected loadout from the lobby controller.
  try{
    const lp=window.__duckLoadout?window.__duckLoadout():null;
    characterBonus=lp?.character||{atk:1,spd:1,parry:1,maxHp:1};
    weaponBonus=lp?.weapon||{damage:1,fire:1};
  }catch(e){
    characterBonus={atk:1,spd:1,parry:1,maxHp:1};
    weaponBonus={damage:1,fire:1};
  }
  reviveUsed=false;
  stage=n;
  kills=0;
  boss=(stage%5===0);
  total=boss?1:Math.min(16,7+Math.floor(stage*.9));
  clearTimer=0;
  gate=false;
  message='';
  messageTimer=0;
  combo=0;
  comboTimer=0;
  skillCharge=0; skillFlash=0; stageStartTime=performance.now(); stageParries=0; stageDamageTaken=0; stageStartTime=performance.now(); stageParries=0; stageDamageTaken=0;
  intro=1.25;
  rocks=[]; shots=[]; particles=[]; pickups=[];
  makeCovers();
  enemies=[];
  if(boss){
    enemies.push({
      type:'boss',x:vw*.5,y:vh*.20,r:48,
      hp:18+stage*2,max:18+stage*2,speed:38+Math.min(35,stage*1.2),fire:.8,phase:0
    });
  }else{
    for(let i=0;i<total;i++) spawnEnemy(i);
  }
  player.x=vw*.5;
  player.y=vh*.80;
  player.hp=Math.min(player.maxHp, player.hp+25*characterBonus.maxHp);
  player.x=clamp(player.x,32,Math.max(32,vw-32));
  player.y=clamp(player.y,vh*.48,Math.max(vh*.48,vh-90));
  player.inv=.8;
  running=true;
  last=performance.now();
}

function nextStage(){
  startStage(stage+1);
}
function spawnEnemy(i){
  const types=['normal','fast','tank','sniper','elite'];
  const type=types[i%types.length];
  const margin=55;
  const scale=1+Math.min(1.25,stage*.045);
  const base={
    normal:{r:23,hp:2,speed:68,fire:1.55},
    fast:{r:20,hp:1,speed:115,fire:1.15},
    tank:{r:30,hp:4,speed:42,fire:2.0},
    sniper:{r:22,hp:2,speed:32,fire:2.55},
    elite:{r:26,hp:5,speed:82,fire:1.25}
  }[type];
  enemies.push({
    type,x:margin+Math.random()*(vw-margin*2),
    y:vh*.15+Math.random()*vh*.28,
    r:base.r,
    hp:Math.ceil(base.hp*scale),max:Math.ceil(base.hp*scale),
    speed:base.speed*(1+Math.min(.45,stage*.012)),
    fire:Math.max(.55,base.fire-Math.min(.35,stage*.01))*.55+Math.random()*.35, telegraph:0,
    phase:Math.random()*6.28
  });
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function burst(x,y,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45+Math.random()*.35});
  }
}

function shootPlayer(){
  shots.push({x:player.x,y:player.y-34,vx:0,vy:-520,r:7,life:2,damage:weaponBonus.damage*(1+(level-1)*.035)});
}
function enemyShoot(e){
  const dx=player.x-e.x,dy=player.y-e.y,L=Math.hypot(dx,dy)||1;
  const sp=e.type==='sniper'?255:e.type==='elite'?225:190; rocks.push({x:e.x+dx/L*8,y:e.y+dy/L*8,vx:dx/L*sp,vy:dy/L*sp,r:e.type==='tank'?12:10,life:4,parried:false});
}

function hitEnemy(e,damage=1){
  e.hp-=damage;
  burst(e.x,e.y,10);
  shake=Math.max(shake,3);
  if(e.hp<=0){
    kills++; skillCharge=Math.min(skillMax,skillCharge+12); if(window.__duckMissionEvent)window.__duckMissionEvent('kill'); burst(e.x,e.y,18);
    e.dead=true;
    pickups.push({x:e.x,y:e.y,type:Math.random()<.72?'coin':'xp',life:8,bob:Math.random()*6.28});
    message='격파!';
    messageTimer=.28;
  }
}

function parryAt(x,y){
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i], d=Math.hypot(r.x-x,r.y-y);
    if(d<72){
      const nearPlayer=Math.hypot(r.x-player.x,r.y-player.y);
      const isPerfect=nearPlayer<(82*characterBonus.parry);
      r.parried=true;
      const dx=player.x-r.x,dy=player.y-r.y,L=Math.hypot(dx,dy)||1;
      r.vx=dx/L*720; r.vy=dy/L*720;
      r.x=player.x; r.y=player.y;
      combo++; stageParries++;
      skillCharge=Math.min(skillMax,skillCharge+(isPerfect?24:16));
      comboTimer=1.6;
      if(isPerfect){
        perfect++;
        r.vx*=1.35; r.vy*=1.35;
        message='PERFECT PARRY!';
        messageTimer=.62;
        shake=8;
      }else{
        message='PARRY!';
        messageTimer=.38;
        shake=4;
      }
      burst(r.x,r.y,isPerfect?18:10);
      return true;
    }
  }
  return false;
}

function useSkill(){
  if(!running || upgradeOpen || skillCharge<skillMax) return false;
  skillCharge=0; skillFlash=.55; shake=10; message='돌진 폭발!'; messageTimer=.55;
  burst(player.x,player.y,34);
  for(const r of rocks){ r.life=0; }
  for(const e of enemies){
    if(e.dead) continue;
    const d=Math.hypot(e.x-player.x,e.y-player.y);
    if(d<190){ hitEnemy(e, e.type==='boss'?3.2:3); }
  }
  return true;
}

function chooseUpgrade(i){
  if(!upgradeOpen) return;
  if(i===0){ player.fire=Math.max(0,player.fire-.08); player.speed+=10; }
  if(i===1){ player.maxHp+=20; player.hp=player.maxHp; }
  if(i===2){ player.parryBonus=Math.min(.2,(player.parryBonus||0)+.04); }
  upgradeOpen=false; running=true; message='강화 완료!'; messageTimer=.55; levelFlash=.55; burst(player.x,player.y,18); shake=4; last=performance.now();
}

function pointerPos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

document.getElementById('start').addEventListener('click', e=>{
  e.preventDefault();
  reset();
  e.currentTarget.style.display='none';
});

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=pointerPos(e);
  if(upgradeOpen){
    const w=Math.min(vw-36,430), h=250, x=(vw-w)/2, y=(vh-h)/2;
    const bh=45, gap=10, by=y+82;
    for(let i=0;i<3;i++){
      const yy=by+i*(bh+gap);
      if(p.x>=x+18 && p.x<=x+w-18 && p.y>=yy && p.y<=yy+bh){ chooseUpgrade(i); return; }
    }
    return;
  }
  if(!running){
    if(gate){ nextStage(); }
    else { reset(); }
    return;
  }
  if(p.y>vh*.74 && Math.abs(p.x-vw/2)<58){ if(useSkill()) return; }
  if(p.y>vh*.55){
    joy.active=true; joy.id=e.pointerId; joy.baseX=p.x; joy.baseY=p.y; joy.x=p.x; joy.y=p.y;
  }
  parryAt(p.x,p.y);
});
cv.addEventListener('pointermove',e=>{
  if(!joy.active || e.pointerId!==joy.id) return;
  const p=pointerPos(e), dx=p.x-joy.baseX,dy=p.y-joy.baseY,L=Math.hypot(dx,dy),m=62;
  if(L>m){joy.x=joy.baseX+dx/L*m;joy.y=joy.baseY+dy/L*m;}
  else {joy.x=p.x;joy.y=p.y;}
});
function joyEnd(e){
  if(e.pointerId===joy.id){joy.active=false;joy.id=null;}
}
cv.addEventListener('pointerup',joyEnd);
cv.addEventListener('pointercancel',joyEnd);

function update(dt){
  if(!running) return;
  if(intro>0){ intro-=dt; }

  if(player.inv>0) player.inv-=dt;
  if(messageTimer>0) messageTimer-=dt;
  if(levelFlash>0) levelFlash-=dt;
  if(comboTimer>0){comboTimer-=dt;}else{combo=0;}
  shake=Math.max(0,shake-dt*24);

  let ax=0,ay=0;
  if(joy.active){
    ax=clamp((joy.x-joy.baseX)/62,-1,1);
    ay=clamp((joy.y-joy.baseY)/62,-1,1);
  }
  const len=Math.hypot(ax,ay)||1;
  moveAroundCovers(player,ax/len*player.speed*dt,ay/len*player.speed*dt);
  player.x=clamp(player.x,32,vw-32);
  player.y=clamp(player.y,vh*.48,vh-90);

  player.fire-=dt;
  if(player.fire<=0){player.fire=Math.max(.24,.42-(level-1)*.012);shootPlayer();}

  for(const e of enemies){
    if(e.dead) continue;
    const dx=player.x-e.x,dy=player.y-e.y,L=Math.hypot(dx,dy)||1;
    const desired=e.type==='boss'?260:e.type==='fast'?135:e.type==='tank'?220:175;
    if(L>desired){
      moveAroundCovers(e,dx/L*e.speed*dt,dy/L*e.speed*dt);
    }else if(e.type==='boss'){
      e.phase+=dt;
      const enraged=e.hp/e.max<.5;
      e.x=vw*.5+Math.sin(e.phase*(enraged?1.25:.9))*vw*(enraged?.31:.28);
      e.y=vh*.18+Math.sin(e.phase*(enraged?2.15:1.7))*(enraged?25:18);
      if(enraged) e.speed=Math.min(100,e.speed+dt*2);
    }else if(e.type==='fast'){
      moveAroundCovers(e,-dx/L*e.speed*.35*dt,-dy/L*e.speed*.35*dt);
    }
    e.x=clamp(e.x,30,vw-30); e.y=clamp(e.y,vh*.12,vh*.48);
    if(e.telegraph>0){
      e.telegraph-=dt;
      if(e.telegraph<=0){
        e.fire=(e.type==='boss') ? Math.max(.52,.85-stage*.006) : (e.type==='tank' ? 2.0 : (e.type==='fast' ? 1.15 : (e.type==='sniper' ? 2.55 : (e.type==='elite' ? 1.25 : 1.55))));
        enemyShoot(e);
        if(e.type==='boss' && e.hp/e.max<.5){
          const a=Math.atan2(player.y-e.y,player.x-e.x);
          for(const off of [-.18,.18]){
            const aa=a+off; rocks.push({x:e.x,y:e.y,vx:Math.cos(aa)*205,vy:Math.sin(aa)*205,r:10,life:4,parried:false});
          }
        }
      }
    }else{
      e.fire-=dt;
      if(e.fire<=0) e.telegraph=.34;
    }
  }

  for(const p of pickups){
    const bob=Math.sin(p.bob)*3;
    ctx.save();ctx.translate(p.x,p.y+bob);
    if(p.type==='coin'){
      ctx.fillStyle='#ffd34f';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff0a6';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#7a5510';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('₩',0,4);
    }else{
      ctx.fillStyle='#76d8ff';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8fbff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('XP',0,3);
    }
    ctx.restore();
  }

  for(const s of shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    for(const c of covers){
      if(circleRectHit(s,c)){s.life=0;burst(s.x,s.y,4);break;}
    }
    if(s.life<=0) continue;
    for(const e of enemies){
      if(e.dead) continue;
      if(Math.hypot(s.x-e.x,s.y-e.r)<s.r+e.r){s.life=0;hitEnemy(e,s.damage||1);break;}
    }
  }
  shots=shots.filter(s=>s.life>0 && s.y>-30);

  for(const r of rocks){
    r.x+=r.vx*dt;r.y+=r.vy*dt;r.life-=dt;
    for(const c of covers){
      if(circleRectHit(r,c)){ r.life=0; burst(r.x,r.y,6); break; }
    }
    if(r.life<=0) continue;
    if(!r.parried && player.inv<=0 && Math.hypot(r.x-player.x,r.y-player.y)<r.r+player.r){
      player.hp-=18;stageDamageTaken+=18;player.inv=.55;burst(player.x,player.y,14);
      message='피격!';messageTimer=.28;
      if(player.hp<=0 && running){running=false;gate=false;message='GAME OVER';messageTimer=999;setTimeout(function(){try{if(window.__duckShowResult)window.__duckShowResult(false)}catch(e){}},80);}
      r.life=0;
    }
    if(r.parried){
      for(const e of enemies){
        if(e.dead) continue;
        if(Math.hypot(r.x-e.x,r.y-e.y)<r.r+e.r){r.life=0;hitEnemy(e);break;}
      }
    }
  }
  rocks=rocks.filter(r=>r.life>0 && r.x>-50 && r.x<vw+50 && r.y>-50 && r.y<vh+50);

  for(const p of pickups){
    p.life-=dt; p.bob+=dt*4;
    const d=Math.hypot(p.x-player.x,p.y-player.y);
    if(d<42){
      if(p.type==='coin'){
        coins+=1;
        if(window.__duckPersist)window.__duckPersist();
        message='+1 COIN';
      }else{
        xp+=10;
        levelXp+=10;
        if(window.__duckPersist)window.__duckPersist();
        message='+10 XP';
        if(levelXp>=nextXp){
          level++;
          levelXp-=nextXp;
          nextXp=Math.round(nextXp*1.28);
          levelFlash=1.2;
          message='LEVEL UP!';
          messageTimer=1.2;
          player.hp=player.maxHp;
          upgradeOpen=true;
          running=false;
          burst(player.x,player.y,24);
          shake=6;
        }
      }
      messageTimer=.32;
      burst(p.x,p.y,8);
      p.life=0;
    }else if(d<130){
      const dx=player.x-p.x,dy=player.y-p.y,L=Math.hypot(dx,dy)||1;
      p.x+=dx/L*80*dt;p.y+=dy/L*80*dt;
    }
  }
  pickups=pickups.filter(p=>p.life>0);

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);

  enemies=enemies.filter(e=>!e.dead);
  if(enemies.length===0){
    clearTimer+=dt;
    if(clearTimer>.8){
      gate=true;
      running=false;
      message='STAGE CLEAR!';
      messageTimer=999;
      setTimeout(function(){try{if(window.__duckShowResult)window.__duckShowResult(true)}catch(e){}},80);
      burst(vw*.5,vh*.18,24);
    }
  }
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawDuck(x,y,scale=1){
  ctx.save();
  ctx.translate(x,y);
  if(window.__duckReady && DUCK_IMG.naturalWidth){
    const w=58*scale, h=64*scale;
    ctx.shadowColor='rgba(0,0,0,.35)';
    ctx.shadowBlur=10;
    ctx.shadowOffsetY=7;
    ctx.drawImage(DUCK_IMG,-w/2,-h*.62,w,h);
  }else{
    ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.arc(0,0,24*scale,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f28b30';ctx.beginPath();ctx.ellipse(18*scale,3*scale,13*scale,8*scale,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#15191f';ctx.beginPath();ctx.arc(9*scale,-8*scale,3.5*scale,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#61707b';roundRect(-18*scale,-29*scale,36*scale,13*scale,5*scale);ctx.fill();
  }
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x,e.y);
  const r=e.r;
  const bob=Math.sin((performance.now()/240)+e.phase)*1.5;
  ctx.translate(0,bob);

  // soft ground shadow
  ctx.shadowColor='rgba(28,34,22,.34)';
  ctx.shadowBlur=8;ctx.shadowOffsetY=7;

  if(e.type==='boss'){
    // armored boss silhouette
    ctx.fillStyle='#8e3f35';
    ctx.beginPath();ctx.arc(0,2,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3030';
    roundRect(-r*.82,-r*.72,r*1.64,r*.65,12);ctx.fill();
    ctx.fillStyle='#d65a4d';
    roundRect(-r*.64,-r*.58,r*1.28,r*.30,8);ctx.fill();

    ctx.shadowColor='transparent';
    // goggles
    ctx.fillStyle='#272c32';
    roundRect(-r*.56,-r*.38,r*.45,r*.28,6);ctx.fill();
    roundRect(r*.11,-r*.38,r*.45,r*.28,6);ctx.fill();
    ctx.fillStyle='#ffd66a';
    ctx.beginPath();ctx.arc(-r*.33,-r*.24,r*.07,0,Math.PI*2);ctx.arc(r*.33,-r*.24,r*.07,0,Math.PI*2);ctx.fill();

    // beak / face
    ctx.fillStyle='#f3a33b';
    ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(0,9);ctx.lineTo(10,2);ctx.lineTo(0,0);ctx.closePath();ctx.fill();

    // shoulder armor
    ctx.fillStyle='#444b53';
    ctx.beginPath();ctx.arc(-r*.78,8,r*.25,0,Math.PI*2);ctx.arc(r*.78,8,r*.25,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='#ffd866';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#fff4c6';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('BOSS',0,r*.72);
  }else{
    const body=e.type==='tank'?'#536a73':e.type==='fast'?'#c94e49':e.type==='sniper'?'#6a5ca8':e.type==='elite'?'#c28a35':'#8d6247';
    const helmet=e.type==='tank'?'#3d5963':e.type==='fast'?'#7d3131':e.type==='sniper'?'#493e76':e.type==='elite'?'#7d5422':'#5e473a';
    ctx.fillStyle=body;
    ctx.beginPath();ctx.arc(0,2,r*.9,0,Math.PI*2);ctx.fill();

    ctx.shadowColor='transparent';
    // helmet
    ctx.fillStyle=helmet;
    ctx.beginPath();ctx.arc(0,-r*.38,r*.72,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';
    roundRect(-r*.48,-r*.57,r*.96,5,3);ctx.fill();

    // goggles / eyes
    ctx.fillStyle='#252a2f';
    roundRect(-r*.58,-r*.12,r*.45,r*.30,6);ctx.fill();
    roundRect(r*.13,-r*.12,r*.45,r*.30,6);ctx.fill();
    ctx.fillStyle='#fff2b8';
    ctx.beginPath();ctx.arc(-r*.35,-r*.0,r*.065,0,Math.PI*2);ctx.arc(r*.35,-r*.0,r*.065,0,Math.PI*2);ctx.fill();

    // beak
    ctx.fillStyle='#f0a33b';
    ctx.beginPath();ctx.moveTo(-r*.32,r*.18);ctx.lineTo(0,r*.36);ctx.lineTo(r*.32,r*.18);ctx.lineTo(0,r*.12);ctx.closePath();ctx.fill();

    // gear/armor
    if(e.type==='tank'){
      ctx.strokeStyle='#9eabb0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,2,r*.86,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#677980';roundRect(-r*.52,r*.36,r*1.04,r*.22,5);ctx.fill();
    }
    if(e.type==='fast'){
      ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(r*.62,r*.48,4,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#fff';ctx.font='900 8px system-ui';ctx.textAlign='center';
    ctx.fillText(e.type==='tank'?'HEAVY':e.type==='fast'?'SCOUT':e.type==='sniper'?'SNIPER':e.type==='elite'?'ELITE':'RAIDER',0,r*.76);
  }
  ctx.restore();
}
function drawUpgrade(){
  if(!upgradeOpen) return;
  ctx.save();
  ctx.fillStyle='rgba(8,12,18,.76)'; ctx.fillRect(0,0,vw,vh);
  const w=Math.min(vw-36,430), h=250, x=(vw-w)/2, y=(vh-h)/2;
  ctx.fillStyle='#fff8e7'; roundRect(x,y,w,h,22); ctx.fill();
  ctx.fillStyle='#35281d'; ctx.font='900 25px system-ui'; ctx.textAlign='center'; ctx.fillText('LEVEL UP!',vw/2,y+42);
  ctx.font='700 15px system-ui'; ctx.fillStyle='#78624d'; ctx.fillText('강화 하나를 선택하세요',vw/2,y+67);
  const bh=45, gap=10, by=y+82;
  for(let i=0;i<3;i++){
    const bx=x+18, bw=w-36, yy=by+i*(bh+gap);
    ctx.fillStyle='#f0d39a'; roundRect(bx,yy,bw,bh,13); ctx.fill();
    ctx.fillStyle='#3b2b20'; ctx.font='800 17px system-ui'; ctx.fillText((i+1)+'  '+upgradeChoices[i],vw/2,yy+29);
  }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,vw,vh);
  const sx=shake?(Math.random()-.5)*shake:0, sy=shake?(Math.random()-.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);

  // Sky / meadow gradient
  const bg=ctx.createLinearGradient(0,0,0,vh);
  bg.addColorStop(0,'#a8d9ad');bg.addColorStop(.34,'#84bf88');bg.addColorStop(1,'#507a5a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,vw,vh);
  // Stage progress ribbon: gives each 5-stage chapter a clear identity.
  const chapter=Math.floor((stage-1)/5)+1, chapterStage=((stage-1)%5)+1;
  ctx.fillStyle='rgba(19,35,24,.58)';roundRect(vw/2-88,78,176,31,15);ctx.fill();
  ctx.fillStyle='#fff4cf';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(`CHAPTER ${chapter}  ·  ${chapterStage}/5`,vw/2,98);
  ctx.fillStyle='rgba(255,255,255,.20)';roundRect(vw/2-72,104,144,4,2);ctx.fill();
  ctx.fillStyle='#ffd25e';roundRect(vw/2-72,104,144*(chapterStage/5),4,2);ctx.fill();
  // Stage-region atmosphere: the battlefield gradually becomes more intense.
  const region=Math.min(4,Math.floor((stage-1)/5));
  if(region===1){ctx.fillStyle='rgba(255,196,90,.10)';ctx.fillRect(0,0,vw,vh);}
  if(region===2){ctx.fillStyle='rgba(92,142,205,.10)';ctx.fillRect(0,0,vw,vh);}
  if(region===3){ctx.fillStyle='rgba(143,91,173,.11)';ctx.fillRect(0,0,vw,vh);}
  if(region===4){ctx.fillStyle='rgba(255,92,62,.13)';ctx.fillRect(0,0,vw,vh);}


  // Soft distant hills
  ctx.fillStyle='rgba(43,91,55,.20)';
  ctx.beginPath();ctx.moveTo(0,vh*.42);ctx.quadraticCurveTo(vw*.20,vh*.31,vw*.40,vh*.42);ctx.quadraticCurveTo(vw*.65,vh*.29,vw,vh*.41);ctx.lineTo(vw,vh*.56);ctx.lineTo(0,vh*.56);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,244,188,.12)';
  ctx.beginPath();ctx.moveTo(0,vh*.47);ctx.quadraticCurveTo(vw*.26,vh*.38,vw*.53,vh*.47);ctx.quadraticCurveTo(vw*.78,vh*.37,vw,vh*.46);ctx.lineTo(vw,vh*.58);ctx.lineTo(0,vh*.58);ctx.closePath();ctx.fill();

  // Main battlefield lane
  ctx.fillStyle='#d7b36e';
  ctx.beginPath();
  ctx.moveTo(vw*.35,vh*.40);
  ctx.bezierCurveTo(vw*.20,vh*.53,vw*.76,vh*.62,vw*.54,vh);
  ctx.lineTo(vw*.93,vh);
  ctx.bezierCurveTo(vw*.95,vh*.68,vw*.44,vh*.56,vw*.64,vh*.40);
  ctx.closePath();ctx.fill();

  // Lane edge / worn border
  ctx.strokeStyle='rgba(110,76,42,.20)';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(vw*.37,vh*.42);ctx.bezierCurveTo(vw*.27,vh*.54,vw*.73,vh*.62,vw*.56,vh);ctx.stroke();

  // Pebbles and grass detail
  for(let i=0;i<48;i++){
    const px=(i*97+23)%Math.max(1,vw), py=vh*.43+((i*61)%Math.max(1,Math.floor(vh*.56)));
    if(i%2===0){
      ctx.fillStyle='rgba(105,77,45,.16)';
      ctx.beginPath();ctx.ellipse(px,py,2+(i%3),1+(i%2),0,0,Math.PI*2);ctx.fill();
    }else{
      ctx.strokeStyle='rgba(36,92,47,.48)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px,py+7);ctx.lineTo(px-3,py);ctx.moveTo(px,py+7);ctx.lineTo(px+4,py+1);ctx.stroke();
    }
  }

  // Small spring flowers
  for(let i=0;i<12;i++){
    const fx=(i*137+58)%Math.max(1,vw), fy=vh*.48+((i*83)%Math.max(1,Math.floor(vh*.43)));
    ctx.fillStyle=i%2?'#f4a6aa':'#f8d36c';
    for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(fx+Math.cos(k*Math.PI/2)*3,fy+Math.sin(k*Math.PI/2)*3,2.4,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#d18b46';ctx.beginPath();ctx.arc(fx,fy,1.5,0,Math.PI*2);ctx.fill();
  }

  // Cover props
  const props=[[34,vh*.55,55,42],[vw-35,vh*.58,52,40],[48,vh*.77,58,44],[vw-47,vh*.79,60,44]];
  for(const [px,py,pw,ph] of props){
    ctx.fillStyle='rgba(44,58,42,.30)';roundRect(px-pw/2+5,py-ph/2+8,pw,ph,8);ctx.fill();
    ctx.fillStyle='#8b633f';roundRect(px-pw/2,py-ph/2,pw,ph,8);ctx.fill();
    ctx.strokeStyle='#5d422e';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='rgba(255,223,172,.30)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px-pw*.34,py-ph*.34);ctx.lineTo(px+pw*.34,py+ph*.34);ctx.moveTo(px+pw*.34,py-ph*.34);ctx.lineTo(px-pw*.34,py+ph*.34);ctx.stroke();
    ctx.fillStyle='rgba(255,235,187,.16)';roundRect(px-pw*.40,py-ph*.38,pw*.80,6,3);ctx.fill();
  }

  // Top HUD glass panel
  ctx.fillStyle='rgba(22,39,29,.91)';roundRect(10,10,vw-20,78,21);ctx.fill();
  ctx.strokeStyle='rgba(255,239,184,.34)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.07)';roundRect(14,14,vw-28,24,14);ctx.fill();

  ctx.textAlign='left';ctx.fillStyle='#fff8df';ctx.font='1000 18px system-ui';ctx.fillText(`STAGE ${stage}`,25,39);
   if(rocks.length>0){ctx.fillStyle='#ffd45f';ctx.font='900 10px system-ui';ctx.fillText('INCOMING ROCKS',25,77);}
  ctx.fillStyle='#cfe7d0';ctx.font='800 11px system-ui';ctx.fillText(boss?`BOSS · ${kills}/${total}`:`${kills}/${total} 처치`,25,61);

  const bx=vw*.39,bw=vw*.34;
  ctx.fillStyle='rgba(0,0,0,.30)';roundRect(bx,23,bw,15,8);ctx.fill();
  ctx.fillStyle='#63d27a';roundRect(bx,23,bw*Math.max(0,Math.min(1,player.hp/player.maxHp)),15,8);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.30)';roundRect(bx,46,bw,7,4);ctx.fill();
  ctx.fillStyle='#72d7ff';roundRect(bx,46,bw*Math.max(0,Math.min(1,levelXp/nextXp)),7,4);ctx.fill();
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,bx+bw/2,35);

  ctx.textAlign='right';ctx.fillStyle='#ffd45f';ctx.font='1000 13px system-ui';ctx.fillText(`🪙 ${coins}`,vw-24,39);
  ctx.fillStyle='#bce7ff';ctx.font='900 11px system-ui';ctx.fillText(`LV ${level} · XP ${xp}`,vw-24,61);
  // Small stage objectives, visible but unobtrusive.
  const elapsed=Math.max(0,(performance.now()-stageStartTime)/1000);
  const fast=elapsed<38, clean=stageDamageTaken===0;
  ctx.fillStyle='rgba(20,31,23,.58)';roundRect(vw-126,76,102,42,12);ctx.fill();
  ctx.textAlign='left';ctx.font='800 8px system-ui';ctx.fillStyle=fast?'#dff5df':'#a8b7aa';ctx.fillText((fast?'✓':'·')+'  38초 클리어',vw-118,91);
  ctx.fillStyle=clean?'#dff5df':'#a8b7aa';ctx.fillText((clean?'✓':'·')+'  노피격 보너스',vw-118,105);

  // Projectile trails and stones
  for(const s of shots){
    ctx.globalAlpha=.12;ctx.fillStyle='#fff1aa';ctx.beginPath();ctx.arc(s.x,s.y+19,24,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,245,190,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y+13);ctx.lineTo(s.x,s.y+5);ctx.stroke();
    ctx.fillStyle='#f2c35c';ctx.strokeStyle='#fff2bd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,s.r+1,0,Math.PI*2);ctx.fill();ctx.stroke();

function loop(t){
  try{
    const dt=Math.min(.033,(t-last)/1000||0);
    last=t;
    update(dt);
    draw();
  }catch(err){
    // Keep the game alive; reset only transient combat objects.
    rocks=[]; shots=[]; particles=[];
    if(player){
      player.x=clamp(player.x||vw*.5,32,Math.max(32,vw-32));
      player.y=clamp(player.y||vh*.8,vh*.48,Math.max(vh*.48,vh-90));
    }
  }
  requestAnimationFrame(loop);
}
running=false; player={x:vw*.5,y:vh*.80,r:24,hp:100,maxHp:100,speed:300,fire:0,inv:0,dir:0}; enemies=[]; rocks=[]; shots=[]; particles=[]; for(let i=0;i<8;i++) spawnEnemy(i); requestAnimationFrame(loop);

  // Public entry point: this MUST live inside the combat engine IIFE,

      const rs=document.getElementById("resultScreen");
      if(rs) rs.classList.remove("show");
      const lobby=document.getElementById("gameLobby");
      if(lobby) lobby.classList.add("hidden");
      const map=document.getElementById("mapScreen");
      if(map) map.classList.remove("show");
      startStage(s);
      running=true;
      intro=1.25;
      gate=false;
      last=performance.now();
    }catch(e){
      console.error("combat start failed:",e);
    }
  };
  window.__duckStopCombat=function(){
    try{
      running=false;
      gate=false;
      shake=0;
      message="";
      messageTimer=0;
      if(joy){joy.active=false;joy.id=null;}
      if(rocks)rocks.length=0;
      if(shots)shots.length=0;
      if(particles)particles.length=0;
    }catch(e){console.error("stop combat failed:",e);}
  };
  window.__duckGetState=function(){
    return {stage,coins,xp,level,levelXp,nextXp,kills,running,gate,boss,hp:player?player.hp:0,maxHp:player?player.maxHp:100,skillCharge};
  };
  window.__duckPersist=function(){
    try{localStorage.setItem(DUCK_SAVE_KEY,JSON.stringify({coins,xp,level,levelXp,nextXp}));}catch(e){}
  };


})();

  // Single-use revive is handled through a lightweight re-entry, preserving the current run's loadout.
  const revive=document.createElement("button");
  revive.className="resultBtn resultRevive";revive.id="resultRevive";revive.textContent="❤️ 부활하기 (1회)";
  const actions=document.querySelector(".resultActions");
  if(actions && !$("resultRevive"))actions.insertBefore(revive,actions.firstChild);
  let reviveUsed=false;
  revive.onclick=()=>{if(reviveUsed)return;reviveUsed=true;result.classList.remove("show");startBattle(state().stage||profile.selected);revive.style.display="none"};
  setInterval(()=>{try{if(window.__duckPersist)window.__duckPersist();syncLobby()}catch(e){}},1200);
  syncLobby();
})();
</script></body></html>
