<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>돌돌 특공대 v6.6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;touch-action:none}body{position:fixed;inset:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{display:none}.badge{display:none}#hint{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(12,19,28,.9);color:#fff;border-radius:20px;padding:9px 15px;font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none}#start{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:8;border:0;border-radius:26px;padding:14px 26px;background:linear-gradient(#ffd866,#ff9f2f);color:#39220b;font-size:18px;font-weight:900;box-shadow:0 7px 0 #b85f18,0 10px 24px rgba(0,0,0,.3)}#log{position:fixed;bottom:5px;right:6px;color:#ff9b9b;font:10px monospace;z-index:9;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hint">화면 전체를 하나의 게임 좌표계로 사용</div><button id="start">🚀 전투 시작</button><div id="log"></div>
<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const wrap = document.body;

let vw=1, vh=1, dpr=1, running=false, last=0;
let player, enemies=[], rocks=[], shots=[], particles=[];
let joy={active:false,id:null,baseX:0,baseY:0,x:0,y:0};
let stage=1, kills=0, total=8, clearTimer=0, message='', messageTimer=0, combo=0, comboTimer=0, shake=0, perfect=0, gate=false, intro=1.25, boss=false;

function resize(){
  const r=cv.getBoundingClientRect();
  vw=Math.max(1,r.width); vh=Math.max(1,r.height);
  dpr=Math.min(3, window.devicePixelRatio||1);
  const bw=Math.round(vw*dpr), bh=Math.round(vh*dpr);
  if(cv.width!==bw || cv.height!==bh){ cv.width=bw; cv.height=bh; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(wrap);
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,80));
addEventListener('pageshow',resize);
resize();

function reset(){
  stage=1; kills=0; total=8; clearTimer=0; message=''; messageTimer=0; combo=0; comboTimer=0; shake=0; perfect=0; gate=false; intro=1.25; boss=false;
  player={x:vw*.5,y:vh*.80,r:24,hp:100,maxHp:100,speed:300,fire:0,inv:0,dir:0};
  enemies=[]; rocks=[]; shots=[]; particles=[];
  for(let i=0;i<total;i++) spawnEnemy(i);
  running=true; last=performance.now();
}
function startStage(n){
  stage=n;
  kills=0;
  boss=(stage%5===0);
  total=boss?1:Math.min(12,7+stage);
  clearTimer=0;
  gate=false;
  message='';
  messageTimer=0;
  combo=0;
  comboTimer=0;
  intro=1.25;
  rocks=[]; shots=[]; particles=[];
  enemies=[];
  if(boss){
    enemies.push({
      type:'boss',x:vw*.5,y:vh*.20,r:48,
      hp:12,max:12,speed:38,fire:.8,phase:0
    });
  }else{
    for(let i=0;i<total;i++) spawnEnemy(i);
  }
  player.x=vw*.5;
  player.y=vh*.80;
  player.hp=Math.min(player.maxHp, player.hp+25);
  player.inv=.8;
  running=true;
  last=performance.now();
}

function nextStage(){
  startStage(stage+1);
}
function spawnEnemy(i){
  const types=['normal','fast','tank'];
  const type=types[i%3];
  const margin=55;
  enemies.push({
    type,x:margin+Math.random()*(vw-margin*2),
    y:vh*.20+Math.random()*vh*.32,
    r:type==='tank'?30:type==='fast'?20:23,
    hp:type==='tank'?4: type==='fast'?1:2,
    max:type==='tank'?4: type==='fast'?1:2,
    speed:type==='tank'?42:type==='fast'?115:68,
    fire:.7+Math.random()*1.5,
    phase:Math.random()*6.28
  });
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function burst(x,y,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45+Math.random()*.35});
  }
}

function shootPlayer(){
  shots.push({x:player.x,y:player.y-25,vx:0,vy:-520,r:7,life:2});
}
function enemyShoot(e){
  const dx=player.x-e.x,dy=player.y-e.y,L=Math.hypot(dx,dy)||1;
  rocks.push({x:e.x,y:e.y,vx:dx/L*190,vy:dy/L*190,r:10,life:4,parried:false});
}

function hitEnemy(e){
  e.hp--;
  burst(e.x,e.y,10);
  shake=Math.max(shake,3);
  if(e.hp<=0){
    kills++; burst(e.x,e.y,18);
    e.dead=true;
    message='격파!';
    messageTimer=.45;
  }
}

function parryAt(x,y){
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i], d=Math.hypot(r.x-x,r.y-y);
    if(d<72){
      const nearPlayer=Math.hypot(r.x-player.x,r.y-player.y);
      const isPerfect=nearPlayer<82;
      r.parried=true;
      const dx=player.x-r.x,dy=player.y-r.y,L=Math.hypot(dx,dy)||1;
      r.vx=dx/L*720; r.vy=dy/L*720;
      r.x=player.x; r.y=player.y;
      combo++;
      comboTimer=1.6;
      if(isPerfect){
        perfect++;
        r.vx*=1.35; r.vy*=1.35;
        message='PERFECT PARRY!';
        messageTimer=.8;
        shake=8;
      }else{
        message='PARRY!';
        messageTimer=.55;
        shake=4;
      }
      burst(r.x,r.y,isPerfect?18:10);
      return true;
    }
  }
  return false;
}

function pointerPos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

document.getElementById('start').addEventListener('click', e=>{
  e.preventDefault();
  reset();
  e.currentTarget.style.display='none';
});

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=pointerPos(e);
  if(!running){
    if(gate){ nextStage(); }
    else { reset(); }
    return;
  }
  if(p.y>vh*.55){
    joy.active=true; joy.id=e.pointerId; joy.baseX=p.x; joy.baseY=p.y; joy.x=p.x; joy.y=p.y;
  }
  parryAt(p.x,p.y);
});
cv.addEventListener('pointermove',e=>{
  if(!joy.active || e.pointerId!==joy.id) return;
  const p=pointerPos(e), dx=p.x-joy.baseX,dy=p.y-joy.baseY,L=Math.hypot(dx,dy),m=62;
  if(L>m){joy.x=joy.baseX+dx/L*m;joy.y=joy.baseY+dy/L*m;}
  else {joy.x=p.x;joy.y=p.y;}
});
function joyEnd(e){
  if(e.pointerId===joy.id){joy.active=false;joy.id=null;}
}
cv.addEventListener('pointerup',joyEnd);
cv.addEventListener('pointercancel',joyEnd);

function update(dt){
  if(!running) return;
  if(intro>0){ intro-=dt; return; }

  if(player.inv>0) player.inv-=dt;
  if(messageTimer>0) messageTimer-=dt;
  if(comboTimer>0){comboTimer-=dt;}else{combo=0;}
  shake=Math.max(0,shake-dt*24);

  let ax=0,ay=0;
  if(joy.active){
    ax=clamp((joy.x-joy.baseX)/62,-1,1);
    ay=clamp((joy.y-joy.baseY)/62,-1,1);
  }
  const len=Math.hypot(ax,ay)||1;
  player.x=clamp(player.x+ax/len*player.speed*dt,32,vw-32);
  player.y=clamp(player.y+ay/len*player.speed*dt,vh*.48,vh-90);

  player.fire-=dt;
  if(player.fire<=0){player.fire=.42;shootPlayer();}

  for(const e of enemies){
    if(e.dead) continue;
    const dx=player.x-e.x,dy=player.y-e.y,L=Math.hypot(dx,dy)||1;
    const desired=e.type==='boss'?260:e.type==='fast'?135:e.type==='tank'?220:175;
    if(L>desired){
      e.x+=dx/L*e.speed*dt; e.y+=dy/L*e.speed*dt;
    }else if(e.type==='boss'){
      e.phase+=dt;
      e.x=vw*.5+Math.sin(e.phase*.9)*vw*.28;
      e.y=vh*.18+Math.sin(e.phase*1.7)*18;
    }else if(e.type==='fast'){
      e.x-=dx/L*e.speed*.35*dt; e.y-=dy/L*e.speed*.35*dt;
    }
    e.x=clamp(e.x,30,vw-30); e.y=clamp(e.y,vh*.12,vh*.48);
    e.fire-=dt;
    if(e.fire<=0){
      e.fire=(e.type==='boss') ? .85 : (e.type==='tank' ? 2.0 : (e.type==='fast' ? 1.15 : 1.55));
      enemyShoot(e);
    }
  }

  for(const s of shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    for(const e of enemies){
      if(e.dead) continue;
      if(Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){s.life=0;hitEnemy(e);break;}
    }
  }
  shots=shots.filter(s=>s.life>0 && s.y>-30);

  for(const r of rocks){
    r.x+=r.vx*dt;r.y+=r.vy*dt;r.life-=dt;
    if(!r.parried && player.inv<=0 && Math.hypot(r.x-player.x,r.y-player.y)<r.r+player.r){
      player.hp-=18;player.inv=.55;burst(player.x,player.y,14);
      message='피격!';messageTimer=.45;
      if(player.hp<=0){running=false;message='GAME OVER';}
      r.life=0;
    }
    if(r.parried){
      for(const e of enemies){
        if(e.dead) continue;
        if(Math.hypot(r.x-e.x,r.y-e.y)<r.r+e.r){r.life=0;hitEnemy(e);break;}
      }
    }
  }
  rocks=rocks.filter(r=>r.life>0 && r.x>-50 && r.x<vw+50 && r.y>-50 && r.y<vh+50);

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);

  enemies=enemies.filter(e=>!e.dead);
  if(enemies.length===0){
    clearTimer+=dt;
    if(clearTimer>.8){
      gate=true;
      running=false;
      message='STAGE CLEAR!';
      messageTimer=999;
      burst(vw*.5,vh*.18,24);
    }
  }
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawDuck(x,y,scale=1){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e7b83e';ctx.beginPath();ctx.arc(-5,7,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f28b30';ctx.beginPath();ctx.ellipse(18,3,13,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#15191f';ctx.beginPath();ctx.arc(9,-8,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#61707b';roundRect(-18,-29,36,13,5);ctx.fill();
  ctx.fillStyle='#8998a3';roundRect(-10,-42,20,15,4);ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle=e.type==='boss'?'#8e3f68':e.type==='tank'?'#5b6570':e.type==='fast'?'#d95757':'#8d6b4d';
  ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
  if(e.type==='boss'){ctx.strokeStyle='#ffd866';ctx.lineWidth=5;ctx.stroke();ctx.font='bold 20px system-ui';ctx.fillStyle='#ffd866';ctx.fillText('★',0,-8);}
  ctx.fillStyle='#20252b';ctx.beginPath();ctx.arc(-7,-5,3,0,Math.PI*2);ctx.arc(7,-5,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ddd';ctx.font='bold 11px system-ui';ctx.textAlign='center';
  ctx.fillText(e.type==='boss'?'BOSS':e.type==='tank'?'T':e.type==='fast'?'F':'N',0,4);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,vw,vh);

  const sx=shake?(Math.random()-.5)*shake:0;
  const sy=shake?(Math.random()-.5)*shake:0;
  ctx.save();
  ctx.translate(sx,sy);

  // arena
  const g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,'#26303a');g.addColorStop(1,'#141a22');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);

  // subtle floor tiles
  ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
  for(let x=0;x<vw;x+=42){ctx.beginPath();ctx.moveTo(x,vh*.45);ctx.lineTo(x,vh);ctx.stroke();}
  for(let y=vh*.45;y<vh;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(vw,y);ctx.stroke();}

  // top HUD
  ctx.fillStyle='rgba(0,0,0,.45)';roundRect(12,12,vw-24,52,15);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='left';
  ctx.fillText(`STAGE ${stage}`,26,34);
  ctx.font='13px system-ui';ctx.fillStyle='#cdd6df';ctx.fillText(`적 ${kills}/${total}`,26,53);

  ctx.fillStyle='#39424c';roundRect(vw*.48,25,vw*.43,14,7);ctx.fill();
  ctx.fillStyle='#55d66b';roundRect(vw*.48,25,vw*.43*(player.hp/player.maxHp),14,7);ctx.fill();

  if(combo>0){
    ctx.fillStyle='#ffd85a';ctx.font='900 17px system-ui';ctx.textAlign='right';
    ctx.fillText(`COMBO ×${combo}`,vw-22,54);
  }

  for(const s of shots){
    ctx.globalAlpha=.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y+10,s.r*2.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle='#f6f7fa';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  for(const r of rocks){
    ctx.fillStyle=r.parried?'#ffdc65':'#a9b1b8';
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();
    if(r.parried){ctx.strokeStyle='#fff2a8';ctx.lineWidth=3;ctx.stroke();}
  }
  for(const e of enemies){
    drawEnemy(e);
    ctx.fillStyle='#2b3035';roundRect(e.x-(e.type==='boss'?48:24),e.y-e.r-12,(e.type==='boss'?96:48),6,3);ctx.fill();
    ctx.fillStyle='#ef5a5a';roundRect(e.x-(e.type==='boss'?48:24),e.y-e.r-12,(e.type==='boss'?96:48)*(e.hp/e.max),6,3);ctx.fill();
  }

  if(player.inv<=0 || Math.floor(performance.now()/70)%2===0) drawDuck(player.x,player.y);

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle='#fff';
    ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;
  }

  // joystick
  if(joy.active){
    ctx.globalAlpha=.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.baseX,joy.baseY,62,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.x,joy.y,27,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(78,vh-86,52,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('DRAG',78,vh-82);
  }

  if(intro>0){
    ctx.fillStyle='rgba(5,8,12,.52)';ctx.fillRect(0,0,vw,vh);
    ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.textAlign='center';
    ctx.fillText(boss?'BOSS STAGE':'STAGE '+stage,vw/2,vh*.43);
    ctx.font='bold 16px system-ui';ctx.fillStyle='#ffd866';
    ctx.fillText(boss?'⚠️ 강력한 적 출현':'전투 준비!',vw/2,vh*.49);
  }

  if(messageTimer>0){
    ctx.fillStyle=message.includes('PERFECT')?'rgba(255,184,50,.18)':'rgba(0,0,0,.55)';
    ctx.fillRect(0,0,vw,vh);
    ctx.fillStyle='rgba(0,0,0,.55)';roundRect(vw*.5-90,vh*.42,180,52,18);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(message,vw*.5,vh*.42+34);
  }

  if(!running){
    ctx.fillStyle='rgba(5,8,12,.72)';ctx.fillRect(0,0,vw,vh);
    ctx.fillStyle='#fff';ctx.font='900 30px system-ui';ctx.textAlign='center';
    ctx.fillText(message==='GAME OVER'?'GAME OVER':'STAGE CLEAR!',vw/2,vh*.42);
    if(gate){
      ctx.fillStyle='#ffd866';roundRect(vw*.5-105,vh*.52,210,54,18);ctx.fill();
      ctx.fillStyle='#3a260d';ctx.font='900 18px system-ui';
      ctx.fillText(`STAGE ${stage+1}  ▶`,vw/2,vh*.52+35);
    }else{
      ctx.font='15px system-ui';ctx.fillStyle='#d9e0e7';
      ctx.fillText('탭해서 다시 도전',vw/2,vh*.49);
    }
  }
  ctx.restore();
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
running=false; player={x:vw*.5,y:vh*.80,r:24,hp:100,maxHp:100,speed:300,fire:0,inv:0,dir:0}; enemies=[]; rocks=[]; shots=[]; particles=[]; for(let i=0;i<8;i++) spawnEnemy(i); requestAnimationFrame(loop);
})();
</script>
</body></html>
